# Blank issues stay ENABLED deliberately. issue-triage.yml allows six type
# labels (bug, enhancement, documentation, refactor, security, question) and the
# forms here label only bug, enhancement, documentation and question. Disabling
# blank issues would push every refactor- or security-shaped report into
# whichever form fits it worst. A blank issue also arrives with every label
# dimension empty, which is the case the triage model classifies best.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/Al-jwharah/Aj-Crew/blob/main/SECURITY.md
    about: Report privately as SECURITY.md describes. Do not open a public issue.
