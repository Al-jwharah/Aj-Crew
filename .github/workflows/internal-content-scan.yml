name: Internal Content Scan

# Self-contained OSS fork-boundary gate for Al-jwharah/Aj-Crew.
# Runs entirely offline on standard GitHub-hosted runners with zero AWS OIDC
# roles, zero private S3 buckets, and zero external secrets, scanning ONLY the
# added lines and newly created files of the change via
# `scripts/check_oss_fork_boundaries.py`.

on:
  workflow_call:

permissions: {}

jobs:
  scan:
    name: internal-content-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Compute the diff
        env:
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${MG_BASE:-}" ]; then
            BASE="$MG_BASE"; HEAD="$MG_HEAD"
          elif [ -n "${PR_BASE:-}" ]; then
            BASE="$PR_BASE"; HEAD="$PUSH_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_HEAD"
          fi
          case "$BASE" in
            0000000000000000000000000000000000000000|'') BASE="$HEAD^" ;;
          esac
          echo "range $BASE...$HEAD"
          git diff --unified=0 "$BASE" "$HEAD" > "$RUNNER_TEMP/change.diff"
          wc -l < "$RUNNER_TEMP/change.diff" | xargs echo "diff lines:"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Scan added lines against OSS fork boundaries
        run: python3 scripts/check_oss_fork_boundaries.py --diff-file "$RUNNER_TEMP/change.diff"
