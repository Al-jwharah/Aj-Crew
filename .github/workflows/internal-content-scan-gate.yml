name: Internal Content Scan Gate

# Caller workflow for the offline OSS fork-boundary gate (`scripts/check_oss_fork_boundaries.py`).
# Because the scanner needs no AWS OIDC credentials or private S3 secrets, both
# same-repo and fork PRs reach a real verdict directly.

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    uses: ./.github/workflows/internal-content-scan.yml
    permissions:
      contents: read
