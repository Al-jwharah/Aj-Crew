<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none">
  <rect width="480" height="270" fill="#161e1c"/>
  <!-- Connection lines -->
  <line x1="120" y1="135" x2="195" y2="95" stroke="#09907f" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="135" x2="195" y2="175" stroke="#09907f" stroke-width="1.5" opacity="0.6"/>
  <line x1="225" y1="95" x2="300" y2="135" stroke="#09907f" stroke-width="1.5" opacity="0.6"/>
  <line x1="225" y1="175" x2="300" y2="135" stroke="#09907f" stroke-width="1.5" opacity="0.6"/>
  <line x1="330" y1="135" x2="380" y2="135" stroke="#09907f" stroke-width="1.5" opacity="0.6"/>
  <!-- Glow effects -->
  <circle cx="120" cy="135" r="25" fill="#09907f" opacity="0.08"/>
  <circle cx="210" cy="95" r="20" fill="#02b09d" opacity="0.08"/>
  <circle cx="210" cy="175" r="20" fill="#02b09d" opacity="0.08"/>
  <circle cx="315" cy="135" r="22" fill="#05baa6" opacity="0.08"/>
  <circle cx="395" cy="135" r="20" fill="#0cbfaa" opacity="0.08"/>
  <!-- Nodes -->
  <circle cx="120" cy="135" r="15" stroke="#09907f" stroke-width="2" fill="#002a25" />
  <circle cx="120" cy="135" r="5" fill="#02b09d" opacity="0.8"/>
  <circle cx="210" cy="95" r="13" stroke="#02b09d" stroke-width="2" fill="#002a25"/>
  <circle cx="210" cy="95" r="4" fill="#62cfbd" opacity="0.8"/>
  <circle cx="210" cy="175" r="13" stroke="#02b09d" stroke-width="2" fill="#002a25"/>
  <circle cx="210" cy="175" r="4" fill="#62cfbd" opacity="0.8"/>
  <circle cx="315" cy="135" r="14" stroke="#05baa6" stroke-width="2" fill="#002a25"/>
  <circle cx="315" cy="135" r="5" fill="#6fd7c5" opacity="0.8"/>
  <!-- End node (diamond) -->
  <polygon points="395,120 410,135 395,150 380,135" stroke="#0cbfaa" stroke-width="2" fill="#002a25"/>
  <circle cx="395" cy="135" r="4" fill="#b3ede1" opacity="0.8"/>
  <!-- Pulse rings -->
  <circle cx="120" cy="135" r="20" stroke="#09907f" stroke-width="0.5" fill="none" opacity="0.3"/>
  <circle cx="315" cy="135" r="19" stroke="#05baa6" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Accent dots -->
  <circle cx="60" cy="60" r="1.5" fill="#09907f" opacity="0.4"/>
  <circle cx="440" cy="50" r="1.5" fill="#05baa6" opacity="0.3"/>
  <circle cx="70" cy="220" r="1" fill="#02b09d" opacity="0.3"/>
  <circle cx="420" cy="230" r="1.5" fill="#0cbfaa" opacity="0.3"/>
</svg>
