<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="PPTX Maker">
  <defs>
    <linearGradient id="pm-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7f3"/>
      <stop offset="100%" stop-color="#caeee6"/>
    </linearGradient>
    <linearGradient id="pm-slide-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="12" fill="url(#pm-bg-l)"/>
  <circle cx="58" cy="44" r="22" fill="#a7e2d6" opacity="0.55"/>
  <circle cx="428" cy="228" r="30" fill="#62cfbd" opacity="0.35"/>

  <!-- Stacked slides, back to front: a deck taking shape -->
  <g transform="translate(96,58)">
    <rect x="26" y="26" width="196" height="126" rx="8" fill="#a7e2d6" stroke="#62cfbd" stroke-width="1.2" opacity="0.75"/>
    <rect x="13" y="13" width="196" height="126" rx="8" fill="#d1f0e9" stroke="#62cfbd" stroke-width="1.2"/>
    <rect x="0" y="0" width="196" height="126" rx="8" fill="url(#pm-slide-l)" stroke="#09907f" stroke-width="2"/>

    <!-- Title + body lines on the front slide -->
    <rect x="16" y="16" width="86" height="9" rx="4.5" fill="#09907f"/>
    <rect x="16" y="34" width="140" height="5" rx="2.5" fill="#a7e2d6"/>
    <rect x="16" y="45" width="112" height="5" rx="2.5" fill="#caeee6"/>

    <!-- A small chart, the shape most decks end up carrying -->
    <rect x="16" y="66" width="24" height="42" rx="3" fill="#bfdbfe"/>
    <rect x="46" y="78" width="24" height="30" rx="3" fill="#bbf7d0"/>
    <rect x="76" y="71" width="24" height="37" rx="3" fill="#fde68a"/>
    <rect x="106" y="60" width="24" height="48" rx="3" fill="#fbcfe8"/>

    <!-- Composition cursor: the agent placing a component -->
    <rect x="142" y="62" width="40" height="46" rx="4" fill="none" stroke="#09907f" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85"/>
    <path d="M176,104 L176,122 L182,116 L187,127 L191,125 L186,114 L194,113 Z" fill="#007769"/>
  </g>

  <!-- Chat bubbles: the deck is authored by conversation -->
  <g transform="translate(330,74)">
    <rect x="0" y="0" width="104" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
    <rect x="12" y="11" width="58" height="4.5" rx="2.25" fill="#62cfbd"/>
    <rect x="8" y="36" width="88" height="26" rx="13" fill="#09907f" opacity="0.9"/>
    <rect x="20" y="47" width="48" height="4.5" rx="2.25" fill="#d1f0e9"/>
    <rect x="0" y="72" width="104" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
    <rect x="12" y="83" width="70" height="4.5" rx="2.25" fill="#62cfbd"/>
  </g>
</svg>
