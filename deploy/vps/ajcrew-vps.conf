# Systemd drop-in override for 24/7 low-RAM VPS deployments (~1 GB RAM).
#
# Install after `ajcrew service install`:
#   sudo mkdir -p /etc/systemd/system/ajcrew.service.d
#   sudo cp deploy/vps/ajcrew-vps.conf /etc/systemd/system/ajcrew.service.d/vps.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ajcrew.service

[Service]
# Soft reclaim pressure at 640 MiB and hard cgroup ceiling at 768 MiB so a ~1 GB
# VPS keeps headroom for sshd, reverse proxy, and kernel page cache.
MemoryAccounting=yes
MemoryHigh=640M
MemoryMax=768M

# Cap glibc per-thread malloc arenas and trim docstrings in worker processes.
Environment="MALLOC_ARENA_MAX=2"
Environment="PYTHONOPTIMIZE=1"

Restart=always
RestartSec=10
